<div class="bg-white rounded-2xl shadow-sm p-4 flex flex-col gap-3">

    <!-- Top Row: Avatar + Name + Follow -->
    <div class="flex items-center justify-between gap-3">
  
      <!-- Avatar + Info -->
      <div [routerLink]="['/profile',friend._id]"  class="cursor-pointer flex items-center gap-3 min-w-0">
        <img
          [src]="friend.photo"
          [alt]="friend.name"
          class="w-11 h-11 rounded-full object-cover shrink-0"
        />
        <div class="flex flex-col min-w-0">
          <span class="text-sm font-bold text-gray-800 truncate">
            {{ friend.name }}
          </span>
          <span class="text-xs text-gray-400 truncate">
            {{ friend.username }}
          </span>
        </div>
      </div>
  
      <!-- Follow Button -->
      <button
        (click)="onFollow()"
        class="flex items-center gap-1 text-xs font-semibold text-mainColor border border-blue-200 rounded-lg px-3 py-1.5 hover:bg-blue-50 transition-colors duration-200 shrink-0 cursor-pointer"
      >
        <i class="fa-solid fa-user-plus text-xs"></i>
        Follow
      </button>
  
    </div>
  
    <!-- Bottom Row: Followers + Mutual -->
    <div class="flex items-center gap-3">
      <span class="text-xs text-gray-400">
        {{ friend.followersCount }} followers
      </span>
  
      @if (friend.mutualFollowersCount > 0) {
        <span class="text-xs font-semibold text-mainColor bg-blue-50 px-2 py-0.5 rounded-full">
          {{ friend.mutualFollowersCount }} mutual
        </span>
      }
    </div>
  
  </div>
