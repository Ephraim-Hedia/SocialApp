<!-- DESKTOP -->
<div class="hidden lg:block">

    <div class="bg-white rounded-2xl border border-gray-200 p-3 shadow-sm">
  
      <div class="space-y-2">
  
        @for(item of menuItems; track item.route) {
  
          <a
            [routerLink]="item.route"
            routerLinkActive="bg-blue-50 text-mainColor"
            [routerLinkActiveOptions]="{ exact: true }"
            class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-700 hover:bg-gray-50 transition-all duration-200">
  
            <i [class]="item.icon"></i>
  
            <span>{{ item.title }}</span>
  
          </a>
  
        }
  
      </div>
  
    </div>
  
  </div>
  
  <!-- MOBILE -->
  <div class="lg:hidden">
  
    <div class="bg-white rounded-2xl border border-gray-200 p-2 shadow-sm">
  
      <div class="grid grid-cols-2 gap-2">
  
        @for(item of menuItems; track item.route) {
  
          <a
            [routerLink]="item.route"
            routerLinkActive="bg-blue-50 text-mainColor"
            [routerLinkActiveOptions]="{ exact: true }"
            class="flex items-center justify-center gap-2 px-3 py-3 rounded-xl text-sm font-medium text-gray-700 hover:bg-gray-50 transition-all duration-200">
  
            <i [class]="item.icon"></i>
  
            <span>{{ item.title }}</span>
  
          </a>
  
        }
  
      </div>
  
    </div>
  
  </div>
