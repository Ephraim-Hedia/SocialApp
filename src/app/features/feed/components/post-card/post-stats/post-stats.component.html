<div class="flex items-center justify-between px-4 py-3 border-t border-gray-100 text-sm text-gray-500">

    <!-- LEFT -->
    <div class="flex items-center gap-1">
      <i class="fa-solid fa-thumbs-up text-blue-500"></i>
      <span>{{ post.likesCount }} likes</span>
    </div>
  
    <!-- RIGHT -->
    <div class="flex items-center gap-3">
  
      <span>{{ post.sharesCount }} shares</span>
  
      <span>{{ post.commentsCount }} comments</span>

      <!-- View Details -->
      <a
        [routerLink]="['/posts', post._id]"
        class="font-semibold text-mainColor hover:underline transition-colors duration-200"
      >
        View details
      </a>
  
    </div>
  
  </div>
