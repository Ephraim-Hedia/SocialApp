<!-- 
  DESKTOP: always show full sidebar
  MOBILE: show collapsed bar with toggle
-->

<!-- DESKTOP FULL SIDEBAR (hidden on mobile) -->
<div class="hidden lg:block bg-white rounded-2xl shadow-sm p-4 w-full">
  
  <!-- Header -->
  <div class="flex items-center justify-between mb-3">
    <div class="flex items-center gap-2">
      <i class="fa-solid fa-user-group text-mainColor text-sm"></i>
      <h3 class="text-sm font-bold text-gray-800">Suggested Friends</h3>
    </div>
    <span class="bg-blue-100 text-mainColor text-xs font-bold px-2 py-0.5 rounded-full">
      5
    </span>
  </div>

  <!-- Search -->
  <div class="relative mb-2">
    <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-xs"></i>
    <input
      type="text"
      placeholder="Search friends..."
      class="w-full text-sm text-gray-700 placeholder-gray-400 bg-gray-100 rounded-lg pl-8 pr-3 py-2 outline-none focus:ring-2 focus:ring-blue-200 transition"
    />
  </div>

  <!-- Divider -->
  <hr class="border-gray-100 mb-1" />

  <!-- Friends List -->
  <div class="divide-y divide-gray-100">
    @for (friend of friends; track friend._id) {
      <app-friend-card
      
        [friend]="friend"
        (followClicked)="onFriendFollowed($event)"
      />
    }
  </div>

  <!-- View More -->
  <div class="mt-3 text-center">
    <a
      routerLink="/suggestions"
      class="text-xs font-semibold text-blue-500 hover:text-blue-700 hover:underline transition-colors duration-200"
    >
      View more
    </a>
  </div>

</div>


<!-- MOBILE ACCORDION (visible only on mobile) -->
<div class="lg:hidden bg-white rounded-2xl shadow-sm w-full overflow-hidden">

  <!-- Collapsed Bar (always visible on mobile) -->
  <div class="flex items-center justify-between px-4 py-3">
    <div class="flex items-center gap-2">
      <i class="fa-solid fa-user-group text-blue-600 text-sm"></i>
      <h3 class="text-sm font-bold text-gray-800">Suggested Friends</h3>
    </div>
    <div class="flex items-center gap-2">
      <span class="bg-blue-100 text-blue-600 text-xs font-bold px-2 py-0.5 rounded-full">
        5
      </span>
      <button
        (click)="toggleExpanded()"
        class="text-xs font-semibold text-blue-500 hover:text-blue-700 transition-colors duration-200 cursor-pointer"
      >
        {{ isExpanded() ? 'Hide' : 'Show' }}
      </button>
    </div>
  </div>

  <!-- Expandable Content -->
  @if (isExpanded()) {
    <div class="px-4 pb-4 border-t border-gray-100">

      <!-- Search -->
      <div class="relative my-3">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-xs"></i>
        <input
          type="text"
          placeholder="Search friends..."
          class="w-full text-sm text-gray-700 placeholder-gray-400 bg-gray-100 rounded-lg pl-8 pr-3 py-2 outline-none focus:ring-2 focus:ring-blue-200 transition"
        />
      </div>

      <!-- Friends List -->
      <div class="divide-y divide-gray-100">
        @for (friend of friends; track friend._id) {
          <app-friend-card
            [friend]="friend"
            (followClicked)="onFriendFollowed($event)"
          />
        }
      </div>

      <!-- View More -->
      <div class="mt-3 text-center">
        <a
          routerLink="/suggestions"
          class="w-full block text-sm font-semibold text-blue-500 border border-gray-200 rounded-xl py-2 hover:bg-gray-50 transition-colors duration-200"
        >
          View more
        </a>
      </div>

    </div>
  }

</div>
