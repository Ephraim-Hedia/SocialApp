<div class="flex items-center justify-between gap-3 py-3">

    <!-- Avatar -->
    <img
      [src]="friend.photo"
      [alt]="friend.name"
      class="w-10 h-10 rounded-full object-cover shrink-0"
    />
  
    <!-- Info -->
    <div class="flex flex-col flex-1 min-w-0">
      <span class="text-sm font-semibold text-gray-800 truncate">
        {{ friend.name }}
      </span>
      <span class="text-xs text-gray-400 truncate">
        {{ friend.username }}
      </span>
      <span class="text-xs text-gray-400">
        {{ friend.followersCount }} followers
      </span>
    </div>
  
    <!-- Follow Button -->
    <button
      (click)="onFollow()"
      class="flex items-center gap-1 text-xs font-semibold text-blue-600 border border-blue-200 rounded-lg px-3 py-1.5 hover:bg-blue-50 transition-colors duration-200 shrink-0 cursor-pointer"
    >
      <i class="fa-solid fa-user-plus text-xs"></i>
      Follow
    </button>
  
  </div>
