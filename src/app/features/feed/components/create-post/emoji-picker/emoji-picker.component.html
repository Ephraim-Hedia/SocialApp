<div class="bg-white rounded-2xl shadow-xl border border-gray-200 w-72 overflow-hidden">

    <!-- Search -->
    <div class="p-2 border-b border-gray-100">
      <div class="relative">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-xs"></i>
        <input
          type="text"
          [value]="searchQuery()"
          (input)="searchQuery.set($any($event.target).value)"
          placeholder="Search"
          class="w-full text-sm text-gray-700 placeholder-gray-400 bg-gray-100 rounded-lg pl-8 pr-3 py-1.5 outline-none"
        />
      </div>
    </div>
  
    <!-- Emoji Grid -->
    <div class="h-56 overflow-y-auto p-2 space-y-2">
      @for (category of displayCategories; track category.label; let i = $index) {
        <div>
          <p class="text-xs font-semibold text-gray-400 mb-1 px-1">{{ category.label }}</p>
          <div class="grid grid-cols-8 gap-1.5">
            @for (emoji of category.emojis; track emoji) {
              <button
                (click)="selectEmoji(emoji)"
                class="text-sm p-1 rounded-lg hover:bg-gray-100 transition-colors duration-150 cursor-pointer leading-none"
              >
                {{ emoji }}
              </button>
            }
          </div>
        </div>
      }
    </div>
  
    <!-- Category Tabs -->
    <div class="border-t border-gray-100 px-2 py-1.5 flex items-center justify-around">
      @for (category of categories; track category.label; let i = $index) {
        <button
          (click)="setCategory(i)"
          [class]="activeCategory() === i
            ? 'text-lg p-1 rounded-lg bg-blue-50 cursor-pointer'
            : 'text-lg p-1 rounded-lg hover:bg-gray-100 transition-colors cursor-pointer'"
        >
          {{ category.icon }}
        </button>
      }
    </div>
  
  </div>
