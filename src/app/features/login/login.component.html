<div class="bg-white rounded-2xl p-6 shadow-md border border-gray-200">

    <!-- Tabs -->
    <div class="flex bg-gray-100 rounded-xl p-1 mb-6">
      <a routerLink="/login"
         class="flex-1 text-center py-2 rounded-lg font-medium bg-white shadow">
        Login
      </a>
  
      <a routerLink="/register"
         class="flex-1 text-center py-2 rounded-lg font-medium text-gray-500">
        Register
      </a>
    </div>
  
    <h2 class="text-2xl font-bold mb-1">Log in to Route Posts</h2>
    <p class="text-sm text-gray-500 mb-5">
      Log in and continue your social journey.
    </p>
  
    <form [formGroup]="loginForm" (ngSubmit)="submitForm()" class="space-y-4">

        <!-- Email -->
        <div class="input-wrapper">
          <i class="fa-solid fa-user input-icon"></i>
          <input
            formControlName="login"
            type="text"
            placeholder="Email or username"
            class="input-style"
            [class.input-error]="isInvalid('login')"
          />
        </div>
        @if (getError('login')) {
          <p class="error-text">{{ getError('login') }}</p>
        }

        <!-- Password -->
        <div class="input-wrapper">
            <i class="fa-solid fa-lock input-icon"></i>
            <input
                #password
                formControlName="password"
                type= "password"
                placeholder="Password"
                class="input-style"
                [class.input-error]="isInvalid('password')"/>
            <i 
              [class.fa-eye]="password.type === 'password'"
              [class.fa-eye-slash]="password.type === 'text'"
              class=" fa-solid absolute right-3 top-1/2 -translate-y-1/2 cursor-pointer text-gray-500"
              (click)="togglePassword(password)"
            ></i>
        </div>
        @if (getError('password')) {
          <p class="error-text">{{ getError('password') }}</p>
        }
        <button class="btn-primary">Log In
          @if (loading) {
            <i class="fas fa-spinner animate-spin"></i>
          }
        </button>
      </form>
  
    <div class="text-center mt-4">
      <a routerLink="/forgot-password" class="text-sm text-mainColor">
        Forgot password?
      </a>
    </div>
    @if(errMessage)
    {
      <div class="rounded-xl border border-rose-200 bg-rose-50 px-4 py-2.5 text-sm font-semibold text-rose-700">{{errMessage}}</div>
    }
  
  </div>
