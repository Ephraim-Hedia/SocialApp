<nav class="bg-white border-b border-gray-200">
  <div class="container flex items-center justify-between py-1 px-2 md:px-0 relative">

    <!-- LEFT: LOGO -->
    <a routerLink="/feed" class="flex items-center gap-2">
      <div class="w-8 h-8 bg-mainColor rounded-md flex items-center justify-center">
        <img src="imgs/route.png" class="w-5" />
      </div>
      <span class="font-extrabold text-xl text-gray-900">Route Posts</span>
    </a>

    <!-- CENTER NAV -->
    <div class="flex items-center">
      <div class="flex items-center gap-1 bg-gray-100 rounded-full px-1 py-1">

        <!-- Feed -->
        <a
          routerLink="/feed"
          routerLinkActive="bg-white shadow-sm text-mainColor"
          [routerLinkActiveOptions]="{ exact: true }"
          class="flex items-center hover:bg-white gap-1.5 md:gap-2 px-1.5 md:px-5 py-2 rounded-full text-sm text-gray-600 transition-all duration-200">
          <i class="fa-solid fa-house text-[14px]"></i>
          <span class="font-extrabold">Feed</span>
        </a>

        <!-- Profile -->
        <a
          routerLink="/profile"
          routerLinkActive="bg-white shadow-sm text-mainColor"
          class="flex items-center hover:bg-white gap-1.5 md:gap-2 px-1.5 md:px-5 py-2 rounded-full text-sm text-gray-600 transition-all duration-200">
          <i class="fa-regular fa-user text-[14px]"></i>
          <span class="font-extrabold">Profile</span>
        </a>

        <!-- Notifications -->
        <a
          routerLink="/notification"
          routerLinkActive="bg-white shadow-sm text-mainColor"
          class="flex items-center hover:bg-white gap-1.5 md:gap-2 px-1.5 md:px-5 py-2 rounded-full text-sm text-gray-600 transition-all duration-200 relative">
          <i class="fa-regular fa-bell text-[14px]"></i>
          <span class="font-extrabold">Notifications</span>

          <!-- Dynamic badge from signal -->
          @if (notificationState.unreadCount() > 0) {
            <span class="absolute -top-0.5 p-1 inline-flex justify-center items-center -right-1 min-w-[15px] min-h-[15px] bg-red-500 text-white text-[10px] px-1.5 py-0.5 rounded-full leading-none">
              {{ notificationState.unreadCount() }}
            </span>
          }
        </a>

      </div>
    </div>

    <!-- RIGHT: USER -->
    <div class="relative flex items-center gap-2">
      <button
        (click)="toggleMenu()"
        class="flex cursor-pointer items-center gap-2 bg-gray-100 px-3 py-1.5 rounded-full hover:bg-gray-200 transition">
        <i class="fa-solid fa-bars"></i>
        <img
          [src]="userData?.photo || 'imgs/default-profile.png'"
          class="w-7 h-7 rounded-full object-cover"
        />
        <span class="text-sm font-medium hidden sm:block">{{ userData?.name }}</span>
      </button>

      <!-- DROPDOWN -->
      @if (isMenuOpen) {
        <div class="absolute right-0 top-12 w-56 bg-white border border-gray-200 rounded-xl shadow-md p-2 z-50">

          <a
            routerLink="/profile"
            class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-100 text-sm text-gray-700 transition">
            <i class="fa-regular fa-user text-gray-500"></i>
            Profile

          </a>

          <a
            routerLink="/change-password"
            class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-100 text-sm text-gray-700 transition">
            <i class="fa-solid fa-gear text-gray-500"></i>
            Settings
            
          </a>

          <div class="my-2 border-t border-gray-200"></div>

          <button
            (click)="logOut()"
            class="flex items-center gap-3 cursor-pointer w-full text-left px-3 py-2 rounded-lg hover:bg-gray-100 text-sm text-red-500 transition">
            <i class="fa-solid fa-right-from-bracket"></i>
            Logout
          </button>

        </div>
      }

    </div>

  </div>
</nav>
